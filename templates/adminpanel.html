<!doctype html>
<html>
  <head>
    <title>AdminPanel</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="index,follow" />

    <style data-project-fonts="true">
      @font-face {
        font-family: Inter;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCo3FwrK3iLTfvgaQc78lA2.woff2");
        font-weight: 100 900;
      }

      @font-face {
        font-family: Inter;
        src: url("https://fonts.gstatic.com/s/inter/v20/UcCm3FwrK3iLTcvnYwYZ90A2B58.woff2");
        font-style: italic;
        font-weight: 100 900;
      }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body id="admin_panel_body">
    <div title="" id="hello_admin_text">Welcome to admin panel!</div>
    <div data-type-role="flex-row" id="admin_main_content" class="flex-row">
      <div data-type-role="flex-column" id="column1" class="flex-column">
        <textarea
          name="GetTestMessageArea"
          id="get_test_message_area"
        ></textarea
        ><button
          type="button"
          id="get_test_message_button"
          name="GetTestMessageButton"
        >
          Get test message</button
        ><textarea
          name="UserResetPasswordLoginArea"
          placeholder="Waiting for user's login..."
          required
          id="usr_reset_pswd_login_textarea"
        ></textarea
        ><label
          for=""
          name="UserResetPasswordLabelInfo"
          customattributes="[object Object]"
          id="usr_reset_pswd_label_textarea"
          >Label</label
        ><button
          type="button"
          name="UserResetPasswordButton"
          customattributes="[object Object]"
          id="usr_reset_pswd_btn"
        >
          Reset password</button
        ><textarea
          name="DeleteUserLoginArea"
          placeholder="Waiting for user's login..."
          required
          id="delete_usr_login_textarea"
        >
        </textarea>
        <label for="" id="delete_user_label" name="DeleteUserLabelInfo">Label</label
        ><button
          type="button"
          name="DeleteUserButton"
          customattributes="[object Object]"
          id="delete_usr_btn"
        >
          Delete User
        </button>
      </div>
      <div
        data-type-role="flex-column"
        id="get_all_users_area"
        class="flex-column"
      >
        <button
          type="button"
          name="GetAllUsersButton"
          customattributes="[object Object]"
          id="get_all_usrs_btn"
        >
          Get All Users
        </button>
        <table id="get_all_usrs_table">
          <tbody>
            <tr>

      </div>
    </div>
  </body>
</html>
