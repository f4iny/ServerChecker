<!doctype html>
<html>
    <head>
        <title>Вход</title>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <meta name="robots" content="index,follow"/>
        <style data-project-fonts="true">@font-face { font-family: Inter; src: url("https://fonts.gstatic.com/s/inter/v20/UcCo3FwrK3iLTfvgaQc78lA2.woff2"); font-weight: 100 900; } @font-face { font-family: Inter; src: url("https://fonts.gstatic.com/s/inter/v20/UcCm3FwrK3iLTcvnYwYZ90A2B58.woff2"); font-style: italic; font-weight: 100 900; }</style>
        <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}"/>
    </head>
    <body id="login_body">
        <div id="login_text_div">Форма входа</div>
        <form action="/auth/sign_in" method="post" id="login_form">
            <div id="login_label_div">
                <label id="login_label">Вход</label>
            </div>
            <input type="text" placeholder="Ожидается логин..." required name="login_placeholder" id="login_input"/>
            <div id="password_label_div">
                <label id="password_label">Пароль</label>
            </div>
            <input type="password" required placeholder="Впишите сюда ваш пароль..." name="password_placeholder" id="password_input"/>
            <div id="login_button_div">
                <button type="submit" id="login_button">Вход</button>
            </div>
            <div id="login_switch_div">
                <a href="/register" id="login_switch_link">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </form>

        <!-- Подключение внешнего JS файла из папки static -->
        <script src="{{ url_for('static', path='login.js') }}"></script>
    </body>
</html>
