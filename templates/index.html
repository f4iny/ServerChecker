<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <select id="mySelect" onchange="checkSelection(this)">
            <option value="1">Вариант 1</option>
            <option value="2">Вариант 2</option>
            <option value="action" class="btn-option">➕ Добавить новый...</option>
        </select>

        <script>
        function checkSelection(select) {
            if (select.value === 'action') {
                alert('Нажата кнопка добавления!');
                select.value = '1'; // Сбрасываем выбор на первый элемент
            }
        }
        </script>
        <script src="" async defer></script>
    </body>
</html>
